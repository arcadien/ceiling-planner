<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>devis-bom</title>
<style>
  body { font-family: system-ui, sans-serif; width: 320px; padding: 12px; margin: 0; }
  h3 { margin: 0 0 8px; }
  label { display: block; font-size: 12px; color: #555; margin-top: 8px; }
  input, select { width: 100%; padding: 6px; margin-top: 2px; box-sizing: border-box; }
  button { margin-top: 12px; width: 100%; padding: 8px; background: #2563eb; color: #fff;
           border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  #status { margin-top: 8px; font-size: 12px; min-height: 14px; }
  #status.ok { color: #15803d; }
  #status.err { color: #b91c1c; }
  .options-link { display: block; margin-top: 10px; font-size: 11px; text-align: right; }
</style>
</head>
<body>
  <h3>Capturer ce prix</h3>
  <label for="line">Ligne BOM</label>
  <select id="line"></select>
  <label for="price">Prix</label>
  <input id="price" type="number" step="0.01" min="0" />
  <label for="store">Magasin</label>
  <input id="store" />
  <div id="status"></div>
  <button id="capture">Capturer</button>
  <a class="options-link" href="#" id="open-options">Options</a>
  <script src="popup.js"></script>
</body>
</html>
